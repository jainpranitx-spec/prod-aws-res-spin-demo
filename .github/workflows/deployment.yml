name: "Terraform Multi-Stage Automation"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "ap-southeast-2"
      TF_VAR_public_key_data: ${{ secrets.PUBLIC_KEY_DATA }}
      TF_VAR_private_key_pub_data: ${{ secrets.PRIVATE_KEY_PUB_DATA }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Terraform Engine globally on the runner
      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      # ==========================================
      # STAGE 1: BOOTSTRAP (S3 Bucket Setup)
      # ==========================================
      - name: Initialize Bootstrap
        run: terraform init
        working-directory: ./bootstrap

      - name: Create S3 Backend Bucket
        if: github.event_name == 'push'
        run: terraform apply -auto-approve
        working-directory: ./bootstrap

      # ==========================================
      # STAGE 2: MAIN INFRASTRUCTURE (EC2 & VPC)
      # ==========================================
      - name: Initialize Main Infrastructure Backend
        run: terraform init
        working-directory: ./infrastructure

      - name: Deploy Cluster Resources to AWS
        if: github.event_name == 'push'
        run: terraform apply -auto-approve
        working-directory: ./infrastructure

      # ==========================================
      # OPTIONAL STAGE 3: DESTROY CLEANUP
      # ==========================================
      - name: Destroy All Infrastructure Resources
        if: github.event_name == 'workflow_dispatch'
        run: |
          terraform destroy -auto-approve
          echo "Main infrastructure removed. Now cleaning up bootstrap bucket..."
        working-directory: ./infrastructure

      # Optional safety step: If tearing everything down via manual button, remove the bucket too
      - name: Destroy Bootstrap Storage
        if: github.event_name == 'workflow_dispatch'
        run: terraform destroy -auto-approve
        working-directory: ./bootstrap